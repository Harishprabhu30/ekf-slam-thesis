visual_slam_node:
  ros__parameters:
    map_frame: map
    odom_frame: odom
    base_frame: chassis_link

    publish_map_to_odom_tf: true
    publish_odom_to_base_tf: true

    camera_optical_frames:
      - camera_left_optical
      - camera_right_optical

    enable_image_denoising: true
    rectified_images: false
    enable_imu_fusion: false
